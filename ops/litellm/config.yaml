# LiteLLM proxy config — template with channel/budget-window placeholders.
# Real provider keys live in the server-side .env (never in git).
# Fill channels per manual §4.4: weekly-capped plans get budget_duration: "7d"
# plus max_budget; dual-window plans stack a second budget rule.
#
# Channels are ordered by priority (lower = preferred). When a channel's
# budget window is exhausted LiteLLM falls through to the next one.

model_list:
  # ---- placeholder channels: rename/uncomment on the server ----
  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: anthropic/claude-3-5-sonnet-latest
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #   budget_duration: "7d"        # weekly window
  #   max_budget: 100              # USD-equivalent per window
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: gemini-2.0-flash
  #   litellm_params:
  #     model: gemini/gemini-2.0-flash
  #     api_key: os.environ/GEMINI_API_KEY
  # - model_name: kimi-k2
  #   litellm_params:
  #     model: moonshot-v1-auto
  #     api_key: os.environ/MOONSHOT_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120
  # general_settings.master_key comes from env LITELLM_MASTER_KEY (in .env)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
