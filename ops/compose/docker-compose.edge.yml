# edge-server co-location override (ADR 0004):
# - host nginx owns :80 -> caddy 443 only (ACME TLS-ALPN-01)
# - host loopback :443 is held by hf-sni-router (127.0.0.1/[::1] specific
#   binds block wildcard binds on Linux) -> caddy binds SPECIFIC host IPs
# - tigerbeetle needs io_uring (blocked by default seccomp) and preallocates
#   a 1GiB journal at boot -> 2g cap (400m was an OOM restart loop)
# - TB/minio images: ghcr/daocloud pulls retagged locally (mirror gaps)
# - memory caps: co-location discipline, keep the stack bounded
# - healthchecks use image-native runtimes (litellm has python3, langfuse has
#   node; NEITHER ships curl — the stock curl checks were permanent false
#   negatives)
name: company
services:
  caddy:
    ports: !override
      - "10.1.0.12:443:443"
      - "10.1.0.12:443:443/udp"
      - "[2402:4e00:c011:2700:242a:610a:7a8a:0]:443:443"
      - "[2402:4e00:c011:2700:242a:610a:7a8a:0]:443:443/udp"
  tigerbeetle:
    security_opt: ["seccomp:unconfined"]
    mem_limit: 2g
  tb-init:
    security_opt: ["seccomp:unconfined"]
  gateway:
    image: cloudcrane/gateway:0.1.2
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KERNEL_PG_DSN: postgresql://kernel:${KERNEL_PG_PASSWORD}@pg:5432/company
      OPA_URL: http://opa:8181
    depends_on:
      pg: { condition: service_healthy }
      opa: { condition: service_started }
  clickhouse:
    mem_limit: 1g
  kafka:
    mem_limit: 1g
  litellm:
    mem_limit: 512m
    healthcheck: !override
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\""]
      interval: 20s
      timeout: 8s
      retries: 10
  langfuse-web:
    mem_limit: 1536m
    healthcheck: !override
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 8s
      retries: 12
  langfuse-worker:
    mem_limit: 768m
