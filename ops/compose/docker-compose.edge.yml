# edge-server co-location override (ADR 0004):
# - host nginx owns :80 -> caddy 443 only (ACME TLS-ALPN-01)
# - host loopback :443 is held by hf-sni-router (127.0.0.1/[::1] specific
#   binds block wildcard binds on Linux) -> caddy binds SPECIFIC host IPs
# - tigerbeetle needs io_uring (blocked by default seccomp) and preallocates
#   a 1GiB journal at boot -> 4g cap (aligned with live docker update 2026-09-19; 400m was an OOM restart loop)
# - TB/minio images: ghcr/daocloud pulls retagged locally (mirror gaps)
# - memory caps: co-location discipline, keep the stack bounded
# - healthchecks use image-native runtimes (litellm has python3, langfuse has
#   node; NEITHER ships curl — the stock curl checks were permanent false
#   negatives)
name: company
services:
  caddy:
    ports: !override
      - "${EDGE_IPV4}:443:443"
      - "${EDGE_IPV4}:443:443/udp"
      - "[${EDGE_IPV6}]:443:443"
      - "[${EDGE_IPV6}]:443:443/udp"
  tigerbeetle:
    security_opt: ["seccomp:unconfined"]
    mem_limit: 4g
  tb-init:
    security_opt: ["seccomp:unconfined"]
  gateway:
    image: cloudcrane/gateway:0.1.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # isolated lane: RunscRunner launches runsc containers
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KERNEL_PG_DSN: postgresql://kernel:${KERNEL_PG_PASSWORD}@pg:5432/company
      OPA_URL: http://opa:8181
      KERNEL_ADMIN_TOKEN: ${KERNEL_ADMIN_TOKEN}
      KERNEL_RUNSC_ENABLED: "1"  # isolated lane host assertion (WO-108)
      # --- WO-101 reconciler external adapters (real-system eval config) ---
      # Endpoint/namespace values live in .env (see the WO101_* block in
      # .env.example); names are read by reconciler/external/config.py.
      WO101_REDIS_ADDR: ${WO101_REDIS_ADDR}
      WO101_REDIS_DB: ${WO101_REDIS_DB}
      WO101_REDIS_PREFIX: ${WO101_REDIS_PREFIX}
      WO101_CLICKHOUSE_URL: ${WO101_CLICKHOUSE_URL}
      WO101_CLICKHOUSE_TABLE: ${WO101_CLICKHOUSE_TABLE}
      WO101_MINIO_ENDPOINT: ${WO101_MINIO_ENDPOINT}
      WO101_MINIO_BUCKET: ${WO101_MINIO_BUCKET}
      WO101_ZOT_URL: ${WO101_ZOT_URL}
      WO101_ZOT_REPO: ${WO101_ZOT_REPO}
      WO101_LITELLM_URL: ${WO101_LITELLM_URL}
      WO101_LITELLM_ALIAS_PREFIX: ${WO101_LITELLM_ALIAS_PREFIX}
      WO101_LANGFUSE_URL: ${WO101_LANGFUSE_URL}
      WO101_LANGFUSE_TRACE_NAME: ${WO101_LANGFUSE_TRACE_NAME}
      # Credential passthrough — existing .env variable names only, no new
      # plaintext (same names the langfuse-worker service already uses).
      REDIS_AUTH: ${REDIS_AUTH}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ZOT_USER: ${ZOT_USER}
      ZOT_PASSWORD: ${ZOT_PASSWORD}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    depends_on:
      pg: { condition: service_healthy }
      opa: { condition: service_started }
  clickhouse:
    mem_limit: 1g
  kafka:
    mem_limit: 1g
  litellm:
    mem_limit: 512m
    healthcheck: !override
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\""]
      interval: 20s
      timeout: 8s
      retries: 10
  langfuse-web:
    mem_limit: 1536m
    healthcheck: !override
      test: ["CMD-SHELL", "node -e \"fetch('http://'+process.env.HOSTNAME+':3000/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 8s
      retries: 12
  langfuse-worker:
    mem_limit: 768m
  audit-export:
    image: cloudcrane/audit-export:0.2.0
    restart: unless-stopped
    mem_limit: 256m
    environment:
      RESTATE_ADMIN_URL: http://restate:9070
      KAFKA_BOOTSTRAP: kafka:9092
      KERNEL_PG_DSN: postgresql://kernel:${KERNEL_PG_PASSWORD}@pg:5432/company
      AUDIT_POLL_INTERVAL: "10"
    depends_on:
      pg: { condition: service_healthy }
      kafka: { condition: service_healthy }
      restate: { condition: service_started }

  # ------------------------------------------- Work-order watcher (batch D) --
  # Resident mandates poller (kernel main 59c066d, kernel/watcher/): fetches
  # the mounted mandates clone, seeds an episode per new OPEN work order via
  # the action gateway (POST /v1/workorders, idempotent) and writes one
  # dispatch JSON into the dispatch volume for the external development
  # agent. First cycle is a baseline sweep (records history, dispatches
  # nothing). Image built from the kernel repo deploy/watcher.Dockerfile:
  #   docker build -f deploy/watcher.Dockerfile -t cloudcrane/watcher:0.1.0 .
  # Bring-up is OWNER-GATED (it seeds episodes autonomously):
  #   mkdir -p /opt/company/watcher/{dispatch,state}
  #   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d watcher
  watcher:
    image: cloudcrane/watcher:0.1.0
    restart: unless-stopped
    mem_limit: 256m
    environment:
      KERNEL_ADMIN_TOKEN: ${KERNEL_ADMIN_TOKEN}  # gateway bearer (config alias)
      WATCHER_GATEWAY_URL: http://gateway:8000
      WATCHER_MANDATES_DIR: /work/mandates
      WATCHER_EVALGATE_DIR: /work/evalgate
      WATCHER_DISPATCH_DIR: /work/dispatch
      WATCHER_STATE_PATH: /work/state/state.json
      WATCHER_POLL_INTERVAL: "60"
      # safety pin: first run records the historical work orders without
      # dispatching; flipping this off on an empty ledger would re-open them
      WATCHER_BASELINE_ON_FIRST_RUN: "true"
    volumes:
      # rw: the watcher `git fetch`es INTO the mounted clone; tree reads go
      # against FETCH_HEAD, the working copy is never touched
      - /root/company/cnb-staging/mandates:/work/mandates
      - /root/company/cnb-staging/eval-gate:/work/evalgate:ro
      - /opt/company/watcher/dispatch:/work/dispatch
      - /opt/company/watcher/state:/work/state
      # alert-notify.sh reads ALERT_WEBHOOK_URL from this exact path (its
      # host contract); inside the container absent -> log-only delivery
      - ./.env:/opt/company/platform/ops/compose/.env:ro
      - ../scripts/alert-notify.sh:/usr/local/bin/alert-notify.sh:ro
    depends_on:
      gateway: { condition: service_started }
